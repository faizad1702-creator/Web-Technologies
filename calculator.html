<html>
<head>
<title>Calculator</title>
<script>
function calc(op){
  let a = +num1.value, b = +num2.value, r;
  if(isNaN(a) || isNaN(b)){
    result.innerHTML = "Enter numbers!";
    return;
  }
  if(op=='+') r=a+b;
  else if(op=='-') r=a-b;
  else if(op=='*') r=a*b;
  else if(op=='/') r = (b==0) ? "Cannot divide by 0" : a/b;
  result.innerHTML = "Result: " + r;
}
</script>
</head>
<body align="center">
<h2>Simple Calculator</h2>
<input id="num1" placeholder="First number"><br><br>
<input id="num2" placeholder="Second number"><br><br>

<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>
<p id="result"></p>
</body>
</html>
