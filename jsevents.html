<html>
<head>
    <title>JavaScript Events Example</title>
 <script>
        function showMessage() {
            alert("Button Clicked!");
        }
    function changeText() {
            document.getElementById("text").innerHTML = "You hovered over me!";
        }
    function normalText() {
            document.getElementById("text").innerHTML = "Hover over this text";
        }
    function showInput() {
            let name = document.getElementById("name").value;
            document.getElementById("result").innerHTML = "Hello " + name;
        }
    function pageLoaded() {
            alert("Page Loaded Successfully!");
        }
    </script>
</head>
<body onload="pageLoaded()">
<h2>JavaScript Events Demo</h2>
<button onclick="showMessage()">Click Me</button>
<br><br>
<p id="text" onmouseover="changeText()" onmouseout="normalText()">
    Hover over this text
</p>
Enter your name:
<input type="text" id="name" onchange="showInput()">
<p id="result"></p>
<input type="text" placeholder="Click here" onfocus="this.style.background='yellow'">
<br><br>
<input type="text" placeholder="Click and then leave" onblur="this.style.background='lightgray'">
</body>
</html>
